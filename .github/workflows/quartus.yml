# Build Model3.rbf with Quartus Prime Lite 17.0.0 Build 595, the version the
# README names, on a GitHub-hosted runner. Started by hand (Actions tab ->
# "Quartus build" -> Run workflow) or by a push to a ci-* branch.
name: Quartus build

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Fitter seed (Model3.qsf has 1)
        default: "1"
  push:
    branches: ["ci-*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      QDIR: /opt/intelFPGA_lite/17.0
      BASE: https://downloads.intel.com/akdlm/software/acdsinst/17.0/595/ib_installers
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Cache Quartus 17.0.0
        id: qcache
        uses: actions/cache@v4
        with:
          path: /opt/intelFPGA_lite/17.0
          key: quartus-lite-17.0.0.595-cyclonev

      - name: Install Quartus Lite 17.0.0 Build 595 (Cyclone V only)
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/qi && cd /tmp/qi
          # Intel has moved these files more than once: try each host, and keep
          # a download only if it is the real file, not an HTML page.
          get() {
            for host in https://downloads.intel.com https://download.altera.com http://download.altera.com; do
              url="$host/akdlm/software/acdsinst/17.0/595/ib_installers/$1"
              echo "trying $url"
              curl -fL --retry 3 -A "Mozilla/5.0" -o "$1" "$url" || continue
              size=$(stat -c %s "$1"); echo "  $size bytes: $(file -b "$1" | cut -c1-60)"
              if [ "$size" -gt "$2" ]; then return 0; fi
              head -c 400 "$1"; echo
            done
            return 1
          }
          get QuartusLiteSetup-17.0.0.595-linux.run 1000000000
          get cyclonev-17.0.0.595.qdz 300000000
          chmod +x QuartusLiteSetup-17.0.0.595-linux.run
          sudo ./QuartusLiteSetup-17.0.0.595-linux.run --mode unattended --accept_eula 1 \
            --installdir "$QDIR" --disable-components quartus_help,modelsim_ase,modelsim_ae
          sudo chown -R "$USER" /opt/intelFPGA_lite
          rm -rf /tmp/qi
          du -sh "$QDIR"

      - name: Runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libncurses5 libtinfo5 libxft2 libxext6

      - name: Compile
        run: |
          export PATH="$QDIR/quartus/bin:$PATH"
          quartus_sh --version
          SEED="${{ github.event.inputs.seed }}"
          if [ -n "$SEED" ] && [ "$SEED" != "1" ]; then
            sed -i "s/^set_global_assignment -name SEED .*/set_global_assignment -name SEED $SEED/" Model3.qsf
          fi
          quartus_sh --flow compile Model3

      - name: Timing summary
        if: always()
        run: |
          cat output_files/Model3.fit.summary || true
          grep -A30 "Setup Summary" output_files/Model3.sta.rpt | head -40 || true
          grep -A20 "Hold Summary" output_files/Model3.sta.rpt | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Model3-${{ github.sha }}
          path: |
            output_files/Model3.rbf
            output_files/*.summary
            output_files/*.sta.rpt
            output_files/*.fit.rpt
          if-no-files-found: warn
